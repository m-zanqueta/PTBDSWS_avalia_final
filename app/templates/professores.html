{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
{{ wtf.quick_form(form) }}

<h2>Relação de professores cadastrados</h2>
<table class="table">
    <thead>
        <tr><th>Professor</th><th>Disciplina</th></tr>
    </thead>
    <tbody>
        {% for p in professores %}
        <tr>
            <td>{{ p.nome }}</td>
            <td>{{ p.disciplina.nome if p.disciplina else '' }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
